services:
  renovate:
    image: renovate/renovate:latest
    container_name: renovate
    restart: "no"

    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN: ${GITHUB_TOKEN}
      RENOVATE_AUTODISCOVER: "false"
      RENOVATE_DRY_RUN: null
      LOG_LEVEL: info
      LOG_FILE: /usr/src/app/config/renovate.log
      LOG_FILE_LEVEL: info
      RENOVATE_GIT_PRIVATE_KEY: ${RENOVATE_GIT_PRIVATE_KEY}

    volumes:
      - ./renovate/config.js:/usr/src/app/config.js
      - ./renovate:/usr/src/app/config

